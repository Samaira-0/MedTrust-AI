version: "1.0"
status: "development"
model:
  architecture: densenet121
  pretrained: ImageNet
  num_classes: 1
  dropout_probability: 0.2
task:
  type: binary_classification
  positive_class: Effusion_present
  negative_class: No_Finding
input:
  resolution: [224, 224]
  channels: 3
training:
  seed: 42
  epochs: 20
  batch_size: 32
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: BCEWithLogitsLoss
  class_weights: null
  early_stopping:
    enabled: true
    monitor: val_auroc
    mode: max
    patience: 5
  scheduler:
    type: ReduceLROnPlateau
    monitor: val_auroc
    mode: max
    factor: 0.5
    patience: 2
selection:
  best_checkpoint_metric: val_auroc
reproducibility:
  deterministic_seed: 42
  save_rng_state: true
